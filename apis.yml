x-coverage:
  state: covered
  reason: covered
  detail: >-
    Cardiff is one of the genuinely institution-operated cases in this cohort: five REST contracts
    authored by the University and served from its own WSO2 gateway on api.data.cardiff.ac.uk, plus
    a registered Shibboleth IdP, a self-hosted EPrints OAI-PMH interface, a DataCite repository
    client with its own DOI prefix, and two Crossref members. No vendor contract is attributed to
    Cardiff in this repository. Two caveats are recorded rather than smoothed over. First, at probe
    time on 2026-08-30 the whole gateway and developer portal - data.cardiff.ac.uk and
    api.data.cardiff.ac.uk - 302-redirected every path to the University service-unavailable page at
    outage.cf.ac.uk, so no operation could be exercised and every devportal pointer grades dead; the
    IT status page listed no incident for it. Second, the wider cardiff.ac.uk estate, including
    orca.cardiff.ac.uk, answers 403 to automated clients behind Cloudflare, which is a bot challenge
    and grades live, not dead. Onboarding is gated regardless of the outage: OAuth2 client
    credentials issued only after emailing integration@cardiff.ac.uk with a use case.
  evidence:
  - url: https://api.data.cardiff.ac.uk/lookups/v1/schools
    status: 302
    note: >-
      302 to http://outage.cf.ac.uk/default/ - gateway in maintenance
