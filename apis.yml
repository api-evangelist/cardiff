---
aid: cardiff
name: Cardiff University
x-type: university
x-category: Public Research University
description: >-
  Cardiff University is a public research university in Cardiff, Wales, and a member of the
  Russell Group. Unusually for a UK institution it operates its own API gateway rather than only
  buying one: api.data.cardiff.ac.uk runs WSO2 API Manager under the University's own registrable
  domain and serves five institution-authored REST contracts - Courses, Modules, Lookups,
  Publications and an Echo connectivity test - published through a developer portal at
  data.cardiff.ac.uk/devportal. Access is OAuth2 client-credentials and is not open self-serve:
  external developers must email integration@cardiff.ac.uk with a use case before an application
  can be created. As of a probe on 2026-08-30 both data.cardiff.ac.uk and api.data.cardiff.ac.uk
  302-redirect every path to the University's service-unavailable page at outage.cf.ac.uk, so
  nothing on the gateway is callable from outside at this moment; the contracts in this repository
  were harvested while it was up. Beyond the gateway, Cardiff's genuinely institution-operated
  machine-readable surfaces are its Shibboleth identity federation membership (a registered UK
  Access Management Federation IdP), the OAI-PMH interface of its own EPrints repository ORCA, its
  DataCite repository client and DOI prefix 10.17035, and the ARCCA research-computing GitHub
  organisation. Its research data repository, research portal and library discovery layer are
  vendor platforms running under Cardiff subdomains - Figshare, Clarivate Converis and Ex Libris
  respectively - and are recorded here as tenant relationships, not as Cardiff's engineering.
