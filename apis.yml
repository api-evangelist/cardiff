x-attribution:
  audited: '2026-08-30'
  pipeline: pipeline-university
  institution_surfaces: 18
  tenant_surfaces: 4
  vendor_rejected: 1
  vendor_rejected_detail: >-
    Figshare. Cardiff runs a Figshare for Institutions tenancy at research-data.cardiff.ac.uk;
    the relationship is recorded as a tenant surface and Figshare's generic api.figshare.com
    contract is deliberately NOT saved under this slug. This is the single misattribution class
    this pipeline exists to prevent, and Cardiff had not fallen into it - no vendor spec was
    present to remove.
  misbased_repaired: 13
  misbased_detail: >-
    Ours, not a vendor's. This repo holds five source contracts in openapi/_original/ and the
    refine-openapis per-tag split had carried the CoursesApi title, description and base path
    /courses/v1 onto all sixteen refined documents. Thirteen were on the wrong base and are re-
    based from their true parent; the other three (courses, clearing-adjustments, groups) had
    the right base and a welded title, which is also corrected. The twenty-six derived Postman
    and OpenCollection files inherited the same wrong base and were corrected with them. The
    audit pre-computed eleven of the thirteen; modules and publications were missed because
    their paths collide with the Courses contract on "/" and "/{code}".
