  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-review under the API Evangelist university pipeline, whose first question is not
      "is there a spec" but "who operates the thing the spec describes". Cardiff passes that
      test: all five source contracts are authored by the University and served from
      api.data.cardiff.ac.uk, its own WSO2 gateway on its own registrable domain, so nothing
      in this repo is a vendor's contract wearing Cardiff's name. Two things changed since
      the June review. First, the gateway and the developer portal are DOWN from outside -
      every path on data.cardiff.ac.uk and api.data.cardiff.ac.uk now 302-redirects to the
      University service-unavailable page at outage.cf.ac.uk, where in June the portal
      answered 200 and the gateway answered a correct 401. The IT status page carries no
      incident for either service, so we cannot tell maintenance from decommission and have
      graded every devportal pointer dead while keeping it, rather than deleting Cardiff's
      only documentation on one probe. Second, three institution-operated surfaces the June
      review did not reach were confirmed from third-party registries rather than from
      Cardiff's bot-blocked estate: a Shibboleth IdP registered in the UK Access Management
      Federation, ORCA's OAI-PMH interface registered in ROAR since 2005, and a DataCite
      repository client with DOI prefix 10.17035. Sixteen refined OpenAPIs that had been
      welded onto the wrong base path by our own refine-openapis split were re-based from
      their true parent contracts; that is our defect, not Cardiff's.
    endpoints:
      - url: https://api.data.cardiff.ac.uk/lookups/v1/schools
        status: 302
        note: Redirects to http://outage.cf.ac.uk/default/ - gateway unreachable (was 401 in June).
