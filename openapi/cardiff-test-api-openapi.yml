openapi: 3.2.0
info:
  title: EchoTest Test API
  version: v1
servers:
- url: https://api.data.cardiff.ac.uk/echo/v1
security:
- default: []
tags:
- name: Test
paths:
  /test:
    get:
      parameters:
      - name: in
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: ok
      security:
      - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      tags:
      - Test
      summary: Get test
      x-summary-source: derived
      operationId: getTest
      x-operation-id-source: derived
components:
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.data.cardiff.ac.uk/authorize
          scopes: {}
