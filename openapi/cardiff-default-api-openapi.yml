openapi: 3.2.0
info:
  title: EchoTest * API
  version: v1
servers:
- url: https://api.data.cardiff.ac.uk/echo/v1
security:
- default: []
tags:
- name: '*'
paths:
  /*:
    get:
      parameters:
      - name: in
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - default: []
      x-auth-type: None
      x-throttling-tier: Unlimited
      tags:
      - '*'
      summary: Get *
      x-summary-source: derived
      operationId: get*
      x-operation-id-source: derived
components:
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://api.data.cardiff.ac.uk/authorize
          scopes: {}
